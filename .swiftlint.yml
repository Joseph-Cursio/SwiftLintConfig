# Analyzer rules run only under `swiftlint analyze`, with a compiler log.
# scripts/swiftlint-analyze.sh runs them one at a time: SwiftLint 0.65.1
# crashes running several in one invocation. explicit_self is excluded: it
# conflicts with redundant_self.
analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

# --- Adjustments (see SwiftLint Adjustments) ---

# Names that are a field's standard spelling: `id` (Identifiable), geometry
# (`x`, `y`, `dx`, `dy`), common labels (`at`, `to`), `ui`, and `lub` (a
# lattice's least upper bound). Everything else meets the default lengths.
identifier_name:
  excluded: [id, x, y, dx, dy, at, to, ui, lub]

# Trailing commas in every multi-line collection literal, so adding an
# element is a one-line diff.
trailing_comma:
  mandatory_comma: true

# An empty closure passed as a no-op callback is the point of the call. Empty
# functions, initializers and statement blocks still need a comment saying why.
no_empty_block:
  disabled_block_types:
    - closure_blocks
