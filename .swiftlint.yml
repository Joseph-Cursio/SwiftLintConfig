# Shared SwiftLint configuration: one decision per rule, for every project.
#
# A project's .swiftlint.yml holds only this line and its paths:
#
#   parent_config: ../SwiftLintConfig/.swiftlint.yml
#   included: [Sources, Tests]
#   excluded: [.build]
#
# Don't add rule settings in a project. A rule that doesn't fit is a decision
# to make here, for every project at once, and record in the SwiftLint Rule
# Notes (Obsidian: LLM inspired Projects / SwiftLint Rule Notes):
#   SwiftLint Desirable       on, and the case for keeping it when challenged
#   SwiftLint Exclusions      off, and why
#   SwiftLint Adjustments     on with a setting, and why
#   SwiftLint Never Autofix   on, but its `--fix` can't be trusted
#
# Ground rule: a rule is never turned off or loosened because it has many
# violations. Change the code instead.
#
# Two commands beyond `swiftlint lint`:
#   swiftlint --fix --config .swiftlint.yml --config ../SwiftLintConfig/.swiftlint.nofix.yml
#   ../SwiftLintConfig/scripts/swiftlint-analyze.sh      # the analyzer_rules below

disabled_rules:
  - inclusive_language           # Exclusions: product terminology ("whitelist") in shipped APIs

# Every opt-in lint rule except those in the Exclusions notes:
#   Fights Swift idioms:  explicit_acl, explicit_top_level_acl,
#     explicit_type_interface, no_magic_numbers, prefixed_toplevel_constant,
#     anonymous_argument_in_multiline_closure, switch_case_on_newline,
#     conditional_returns_on_newline, indentation_width,
#     vertical_whitespace_opening_braces, attributes, multiline_arguments,
#     multiline_call_arguments, discouraged_default_parameter
#   High churn:           type_contents_order, one_declaration_per_file,
#     required_deinit
#   Framework misfit:     private_outlet, private_subject, prefer_nimble,
#     discouraged_optional_collection, incompatible_concurrency_annotation
#   Conflicting rules:    contrasted_opening_brace (vs opening_brace),
#     no_extension_access_modifier (vs extension_access_modifier),
#     explicit_enum_raw_value / raw_value_for_camel_cased_codable_enum
#     (vs redundant_string_enum_value)
#   Other:                single_test_class, unneeded_throws_rethrows
#   Never act on it:      sorted_enum_cases (the re-order destroys ordinal enums)
opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - balanced_xctest_lifecycle
  - closure_body_length
